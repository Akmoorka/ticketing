openapi: 3.0.3
info:
  title: Ticketing API
  version: 0.0.0
paths:
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutInput'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterInput'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOutput'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailInput'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailOutput'
          description: ''
  /api/v1/invitations/{token}/accept/:
    post:
      operationId: invitations_accept_create
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptOutput'
          description: ''
  /api/v1/organizations/:
    post:
      operationId: organizations_create
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationCreateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationCreateInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationOutput'
          description: ''
  /api/v1/organizations/{organization_id}/invitations/:
    post:
      operationId: organizations_invitations_create
      parameters:
      - in: path
        name: organization_id
        schema:
          type: integer
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationCreateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationCreateInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOutput'
          description: ''
  /api/v1/organizations/{organization_id}/members/{user_id}/:
    patch:
      operationId: organizations_members_partial_update
      parameters:
      - in: path
        name: organization_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleInput'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOutput'
          description: ''
    delete:
      operationId: organizations_members_destroy
      parameters:
      - in: path
        name: organization_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    InvitationAcceptOutput:
      type: object
      properties:
        organization_id:
          type: integer
        role:
          type: string
      required:
      - organization_id
      - role
    InvitationCreateInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - role
    InvitationOutput:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - email
      - expires_at
      - id
      - role
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
      - email
      - password
    LogoutInput:
      type: object
      properties:
        refresh:
          type: string
          maxLength: 2000
      required:
      - refresh
    MemberOutput:
      type: object
      properties:
        user_id:
          type: integer
        role:
          type: string
      required:
      - role
      - user_id
    OrganizationCreateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    OrganizationOutput:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        status:
          type: string
      required:
      - id
      - name
      - slug
      - status
    PatchedMemberRoleInput:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
      - email
      - password
    RegisterOutput:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
      required:
      - email
      - id
    RoleEnum:
      enum:
      - owner
      - manager
      - checker
      type: string
      description: |-
        * `owner` - Владелец
        * `manager` - Менеджер
        * `checker` - Контролёр
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    VerifyEmailInput:
      type: object
      properties:
        token:
          type: string
          maxLength: 1000
      required:
      - token
    VerifyEmailOutput:
      type: object
      properties:
        status:
          type: string
      required:
      - status
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
